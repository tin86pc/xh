<script>

/* =====================================================
   CẤU HÌNH
===================================================== */

const STORAGE_KEY = "vietqr_info";


/* =====================================================
   FORMAT TIỀN
===================================================== */

function formatMoney(value) {

    if (
        value === "" ||
        value === null ||
        value === undefined
    ) {
        return "";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "";
    }

    return number.toLocaleString("vi-VN");
}


/* =====================================================
   BỎ DẤU CHẤM

   1.000.000
   →
   1000000
===================================================== */

function cleanNumber(value) {

    return String(value)
        .replace(/\./g, "")
        .replace(/,/g, "")
        .replace(/[^\d]/g, "");
}


/* =====================================================
   FORMAT MỘT DÒNG
===================================================== */

function formatOneLine(line) {

    const trimmed = line.trim();


    if (!trimmed) {
        return "";
    }


    /* -----------------------------------------------
       Có dấu *
    ------------------------------------------------ */

    if (trimmed.includes("*")) {

        const pos =
            trimmed.indexOf("*");


        let price =
            trimmed
                .substring(0, pos)
                .replace(/\D/g, "");


        let quantity =
            trimmed
                .substring(pos + 1)
                .replace(/\D/g, "");


        if (!price) {
            return line;
        }


        /*
            Cho phép người dùng đang nhập:

            400000*

            chưa nhập số lượng.
        */

        if (quantity === "") {

            return (
                Number(price)
                    .toLocaleString("vi-VN")
                +
                "*"
            );
        }


        return (
            Number(price)
                .toLocaleString("vi-VN")
            +
            "*"
            +
            quantity
        );
    }


    /* -----------------------------------------------
       Chỉ có số
    ------------------------------------------------ */

    const number =
        trimmed.replace(/\D/g, "");


    if (!number) {
        return line;
    }


    return Number(number)
        .toLocaleString("vi-VN");
}


/* =====================================================
   TEXTAREA
===================================================== */

const priceList =
    document.getElementById(
        "priceList"
    );


/* =====================================================
   XỬ LÝ NHẬP TIỀN

   QUAN TRỌNG:

   Chỉ format dòng hiện tại.

   Không format toàn bộ textarea.

   Vì vậy Enter hoạt động bình thường.
===================================================== */

priceList.addEventListener(
    "input",
    function() {

        const textarea = this;

        const value =
            textarea.value;

        const cursor =
            textarea.selectionStart;


        /*
            Nếu vừa nhấn Enter:

            Tuyệt đối không thay đổi
            nội dung textarea.
        */

        if (
            value[cursor - 1] === "\n"
        ) {

            saveInfo();

            return;
        }


        /*
            Tìm đầu dòng hiện tại.
        */

        const lineStart =
            value.lastIndexOf(
                "\n",
                cursor - 1
            ) + 1;


        /*
            Tìm cuối dòng hiện tại.
        */

        let lineEnd =
            value.indexOf(
                "\n",
                cursor
            );


        if (lineEnd === -1) {

            lineEnd =
                value.length;
        }


        /*
            Lấy dòng hiện tại.
        */

        const currentLine =
            value.substring(
                lineStart,
                lineEnd
            );


        /*
            Format dòng.
        */

        const formattedLine =
            formatOneLine(
                currentLine
            );


        /*
            Không có thay đổi.
        */

        if (
            formattedLine === currentLine
        ) {

            saveInfo();

            return;
        }


        /*
            Thay đúng dòng hiện tại.
        */

        const newValue =

            value.substring(
                0,
                lineStart
            )

            +

            formattedLine

            +

            value.substring(
                lineEnd
            );


        /*
            Độ dài thay đổi.
        */

        const difference =
            formattedLine.length -
            currentLine.length;


        const newCursor =
            Math.max(
                lineStart,
                cursor + difference
            );


        textarea.value =
            newValue;


        /*
            Đưa con trỏ về vị trí cũ.
        */

        try {

            textarea.setSelectionRange(
                newCursor,
                newCursor
            );

        }
        catch (e) {}


        saveInfo();

    }
);


/* =====================================================
   Ô SỐ TIỀN

   Tự thêm dấu chấm.
===================================================== */

const amountInput =
    document.getElementById(
        "amount"
    );


amountInput.addEventListener(
    "input",
    function() {

        const oldValue =
            this.value;

        const cursor =
            this.selectionStart;


        const raw =
            cleanNumber(
                oldValue
            );


        if (!raw) {

            this.value = "";

            saveInfo();

            return;
        }


        const formatted =
            Number(raw)
                .toLocaleString(
                    "vi-VN"
                );


        /*
            Đếm số chữ số trước
            con trỏ.
        */

        const digitsBefore =
            oldValue
                .substring(
                    0,
                    cursor
                )
                .replace(
                    /\D/g,
                    ""
                )
                .length;


        this.value =
            formatted;


        let newCursor = 0;

        let digits = 0;


        while (
            newCursor <
                formatted.length
            &&
            digits <
                digitsBefore
        ) {

            if (
                /\d/.test(
                    formatted[newCursor]
                )
            ) {

                digits++;
            }

            newCursor++;
        }


        try {

            this.setSelectionRange(
                newCursor,
                newCursor
            );

        }
        catch (e) {}


        saveInfo();

    }
);


/* =====================================================
   TÍNH TIỀN
===================================================== */

function calculateMoney() {

    const text =
        priceList.value.trim();


    if (!text) {

        alert(
            "Vui lòng nhập số tiền!"
        );

        return;
    }


    /*
        Chỉ tách theo Enter.

        Ví dụ:

        400000*5
        300000
        150000*2
        50000
    */

    const lines =
        text
            .split(/\r?\n/)
            .map(
                line => line.trim()
            )
            .filter(
                line => line !== ""
            );


    let total = 0;

    const details = [];


    /*
        Duyệt từng dòng.
    */

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];


        /* ==========================================
           CÓ DẤU *

           400.000*5
        ========================================== */

        if (
            line.includes("*")
        ) {

            const parts =
                line.split("*");


            if (
                parts.length !== 2
            ) {

                alert(
                    "Dòng " +
                    (i + 1) +
                    " không đúng dạng."
                );

                return;
            }


            const priceText =
                cleanNumber(
                    parts[0]
                );


            const quantityText =
                cleanNumber(
                    parts[1]
                );


            if (
                !priceText ||
                !quantityText
            ) {

                alert(
                    "Dòng " +
                    (i + 1) +
                    " phải có dạng:\n\n" +
                    "400000*5"
                );

                return;
            }


            const price =
                Number(priceText);


            const quantity =
                Number(quantityText);


            if (
                !Number.isFinite(price) ||
                !Number.isFinite(quantity)
            ) {

                alert(
                    "Dòng " +
                    (i + 1) +
                    " không hợp lệ."
                );

                return;
            }


            const lineTotal =
                price * quantity;


            total +=
                lineTotal;


            details.push(

                formatMoney(price)
                +
                " × "
                +
                formatMoney(quantity)
                +
                " = "
                +
                formatMoney(lineTotal)
                +
                " đ"

            );

        }


        /* ==========================================
           CHỈ CÓ MỘT SỐ

           300000
        ========================================== */

        else {

            const numberText =
                cleanNumber(
                    line
                );


            if (!numberText) {

                alert(
                    "Dòng " +
                    (i + 1) +
                    " không có số tiền."
                );

                return;
            }


            const number =
                Number(numberText);


            if (
                !Number.isFinite(number)
            ) {

                alert(
                    "Dòng " +
                    (i + 1) +
                    " không hợp lệ."
                );

                return;
            }


            total +=
                number;


            details.push(

                formatMoney(number)
                +
                " = "
                +
                formatMoney(number)
                +
                " đ"

            );
        }

    }


    /*
        Làm tròn.
    */

    total =
        Math.round(
            total * 100
        ) / 100;


    /*
        Đưa tổng vào ô Số tiền.
    */

    amountInput.value =
        formatMoney(total);


    /*
        Hiển thị kết quả.
    */

    const resultBox =
        document.getElementById(
            "calcResult"
        );


    resultBox.style.display =
        "block";


    resultBox.innerHTML =

        "<b>Chi tiết:</b><br>" +

        details.join("<br>") +

        '<div class="calc-total">' +

        "TỔNG TIỀN: " +

        formatMoney(total) +

        " đ" +

        "</div>";


    /*
        Sau khi tính mới chuẩn hóa
        toàn bộ nội dung.

        Không ảnh hưởng lúc nhập.
    */

    priceList.value =
        formatPriceList(
            priceList.value
        );


    saveInfo();

}


/* =====================================================
   FORMAT TOÀN BỘ TEXTAREA
===================================================== */

function formatPriceList(text) {

    return text
        .split(/\r?\n/)
        .map(formatOneLine)
        .join("\n");
}


/* =====================================================
   LƯU THÔNG TIN
===================================================== */

function saveInfo() {

    const data = {

        bank:
            document
                .getElementById("bank")
                .value,

        account:
            document
                .getElementById("account")
                .value
                .trim(),

        name:
            document
                .getElementById("name")
                .value
                .trim(),

        amount:
            amountInput
                .value
                .trim(),

        content:
            document
                .getElementById("content")
                .value
                .trim(),

        priceList:
            priceList.value
    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );


    const message =
        document.getElementById(
            "savedMessage"
        );


    message.style.display =
        "block";


    clearTimeout(
        window.saveTimer
    );


    window.saveTimer =
        setTimeout(
            function() {

                message.style.display =
                    "none";

            },
            1000
        );
}


/* =====================================================
   ĐỌC THÔNG TIN ĐÃ LƯU
===================================================== */

function loadInfo() {

    const data =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!data) {
        return;
    }


    try {

        const info =
            JSON.parse(data);


        if (
            info.bank !== undefined
        ) {

            document.getElementById(
                "bank"
            ).value =
                info.bank;
        }


        if (
            info.account !== undefined
        ) {

            document.getElementById(
                "account"
            ).value =
                info.account;
        }


        if (
            info.name !== undefined
        ) {

            document.getElementById(
                "name"
            ).value =
                info.name;
        }


        if (
            info.amount
        ) {

            amountInput.value =
                formatMoney(
                    cleanNumber(
                        info.amount
                    )
                );
        }


        if (
            info.content !== undefined
        ) {

            document.getElementById(
                "content"
            ).value =
                info.content;
        }


        if (
            info.priceList !== undefined
        ) {

            priceList.value =
                info.priceList;
        }

    }
    catch (error) {

        console.log(
            "Lỗi đọc dữ liệu:",
            error
        );
    }
}


/* =====================================================
   XÓA THÔNG TIN ĐÃ LƯU
===================================================== */

function clearSavedInfo() {

    if (
        !confirm(
            "Bạn có chắc muốn xóa toàn bộ thông tin đã lưu?"
        )
    ) {

        return;
    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    document.getElementById(
        "bank"
    ).selectedIndex = 0;


    document.getElementById(
        "account"
    ).value = "";


    document.getElementById(
        "name"
    ).value = "";


    amountInput.value = "";


    document.getElementById(
        "content"
    ).value = "";


    priceList.value = "";


    document.getElementById(
        "qrcode"
    ).innerHTML = "";


    document.getElementById(
        "info"
    ).style.display =
        "none";


    document.getElementById(
        "btnDownload"
    ).style.display =
        "none";


    document.getElementById(
        "calcResult"
    ).style.display =
        "none";


    alert(
        "Đã xóa thông tin đã lưu!"
    );
}


/* =====================================================
   TẠO VIETQR
===================================================== */

function createQR() {

    const bank =
        document
            .getElementById("bank")
            .value;


    const account =
        document
            .getElementById("account")
            .value
            .trim();


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    /*
        1.000.000
        →
        1000000
    */

    const amount =
        cleanNumber(
            amountInput.value
        );


    const content =
        document
            .getElementById("content")
            .value
            .trim();


    if (!account) {

        alert(
            "Vui lòng nhập số tài khoản!"
        );

        return;
    }


    if (!name) {

        alert(
            "Vui lòng nhập tên người nhận!"
        );

        return;
    }


    /*
        Tạo URL VietQR.
    */

    let url =
        "https://img.vietqr.io/image/" +
        bank +
        "-" +
        account +
        "-compact2.jpg";


    const params = [];


    if (amount) {

        params.push(
            "amount=" +
            encodeURIComponent(
                amount
            )
        );
    }


    if (content) {

        params.push(
            "addInfo=" +
            encodeURIComponent(
                content
            )
        );
    }


    if (name) {

        params.push(
            "accountName=" +
            encodeURIComponent(
                name
            )
        );
    }


    if (
        params.length
    ) {

        url +=
            "?" +
            params.join("&");
    }


    /*
        Xóa QR cũ.
    */

    const qr =
        document.getElementById(
            "qrcode"
        );


    qr.innerHTML = "";


    /*
        Tạo ảnh QR.
    */

    const img =
        document.createElement(
            "img"
        );


    img.src =
        url;


    img.alt =
        "VietQR";


    img.style.width =
        "300px";


    img.style.maxWidth =
        "100%";


    img.onload =
        function() {

            document.getElementById(
                "btnDownload"
            ).style.display =
                "block";
        };


    img.onerror =
        function() {

            alert(
                "Không thể tạo VietQR. " +
                "Vui lòng kiểm tra lại ngân hàng và số tài khoản."
            );
        };


    qr.appendChild(
        img
    );


    /*
        Hiển thị thông tin.
    */

    const info =
        document.getElementById(
            "info"
        );


    info.style.display =
        "block";


    info.innerHTML =

        "<b>Người nhận:</b> " +
        escapeHTML(name) +

        "<br>" +

        "<b>Số tài khoản:</b> " +
        escapeHTML(account) +

        "<br>" +

        "<b>Số tiền:</b> " +

        (
            amount
            ?
            formatMoney(amount) +
            " VNĐ"
            :
            "Không cố định"
        )

        +

        "<br>" +

        "<b>Nội dung:</b> " +

        (
            content
            ?
            escapeHTML(content)
            :
            "Không có"
        );


    saveInfo();
}


/* =====================================================
   TẢI QR
===================================================== */

function downloadQR() {

    const img =
        document.querySelector(
            "#qrcode img"
        );


    if (!img) {

        alert(
            "Chưa có QR!"
        );

        return;
    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        img.src;


    link.download =
        "VietQR.png";


    link.target =
        "_blank";


    link.click();
}


/* =====================================================
   CHIA SẺ TRANG WEB BẰNG QR
===================================================== */

function showShareQR() {

    const url =
        window.location.href;


    const qr =
        document.getElementById(
            "shareQRCode"
        );


    qr.innerHTML = "";


    const img =
        document.createElement(
            "img"
        );


    img.src =
        "https://api.qrserver.com/v1/create-qr-code/?" +
        "size=250x250&data=" +
        encodeURIComponent(url);


    img.alt =
        "QR chia sẻ trang web";


    qr.appendChild(
        img
    );


    document.getElementById(
        "shareURL"
    ).textContent =
        url;


    document.getElementById(
        "shareBox"
    ).style.display =
        "block";
}


/* =====================================================
   ĐÓNG QR CHIA SẺ
===================================================== */

function closeShareQR() {

    document.getElementById(
        "shareBox"
    ).style.display =
        "none";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        loadInfo();

    }
);

</script>
